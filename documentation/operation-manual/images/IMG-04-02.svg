<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="91.0mm" viewBox="0 0 1700 910" font-family="Arial, Helvetica, sans-serif">
  <title>IMG-04-02 Control panel, top view, with callouts</title>
  <desc>Front control panel +FR, top view, button placement as corrected by the owner 2026-11-13 (the CAD view had the selector, RESET and START in the wrong places). Left recess: RESET (top), START (bottom). Right recess: E-STOP (top), MANUAL / AUTO selector (bottom). Colours and tags from documentation/electrical/01-schematic-iec/data/project.js: -SJ1 ARE-3-R-22-R, -SJ2 ARF-F-1-10-G green, -SJ3 ARF-F-1-20-Y yellow, -SJ4 ARS-S-2-12, -PH1 display. Selector position legend not drawn: polarity still open in designation-map.md. Antennas drawn as seen in the CAD view, function not documented.</desc>
  <defs>
    <marker id="rot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fff"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- panel plate -->
  <rect x="380" y="20" width="940" height="638" rx="18" fill="#e4e4e4" stroke="#000" stroke-width="5"/>

  <!-- antennas -->
  <path d="M779,124 L802,167" stroke="#000" stroke-width="26" stroke-linecap="round"/>
  <path d="M779,124 L802,167" stroke="#2a2a2a" stroke-width="18" stroke-linecap="round"/>
  <path d="M918,124 L896,167" stroke="#000" stroke-width="26" stroke-linecap="round"/>
  <path d="M918,124 L896,167" stroke="#2a2a2a" stroke-width="18" stroke-linecap="round"/>

  <!-- display -->
  <rect x="623" y="201" width="452" height="372" rx="22" fill="#3a3a3a" stroke="#000" stroke-width="5"/>
  <rect x="660" y="237" width="378" height="298" rx="12" fill="#d9dcdf" stroke="#000" stroke-width="2.5"/>

  <!-- left recess: x 427..588, y 212..561, bevel 41 -->
  <rect x="427" y="212" width="161" height="349" fill="#7c7c7c" stroke="#000" stroke-width="2.5"/>
  <path d="M427,212 L588,212 L547,253 L468,253 Z" fill="#6c6c6c" stroke="#000" stroke-width="1.5"/>
  <path d="M427,212 L468,253 L468,520 L427,561 Z" fill="#cfcfcf" stroke="#000" stroke-width="1.5"/>
  <path d="M588,212 L588,561 L547,520 L547,253 Z" fill="#7a7a7a" stroke="#000" stroke-width="1.5"/>
  <path d="M427,561 L468,520 L547,520 L588,561 Z" fill="#d8d8d8" stroke="#000" stroke-width="1.5"/>
  <rect x="468" y="253" width="79" height="267" fill="#d4d4d4" stroke="#000" stroke-width="2.5"/>

  <!-- right recess: x 1112..1273 -->
  <rect x="1112" y="212" width="161" height="349" fill="#7c7c7c" stroke="#000" stroke-width="2.5"/>
  <path d="M1112,212 L1273,212 L1232,253 L1153,253 Z" fill="#6c6c6c" stroke="#000" stroke-width="1.5"/>
  <path d="M1112,212 L1153,253 L1153,520 L1112,561 Z" fill="#cfcfcf" stroke="#000" stroke-width="1.5"/>
  <path d="M1273,212 L1273,561 L1232,520 L1232,253 Z" fill="#7a7a7a" stroke="#000" stroke-width="1.5"/>
  <path d="M1112,561 L1153,520 L1232,520 L1273,561 Z" fill="#d8d8d8" stroke="#000" stroke-width="1.5"/>
  <rect x="1153" y="253" width="79" height="267" fill="#d4d4d4" stroke="#000" stroke-width="2.5"/>

  <!-- RESET, yellow, left top -->
  <circle cx="507.5" cy="326" r="32" fill="#9a9a9a" stroke="#000" stroke-width="2.5"/>
  <circle cx="507.5" cy="326" r="27" fill="#444"/>
  <circle cx="507.5" cy="326" r="23" fill="#f2c200" stroke="#000" stroke-width="1.5"/>

  <!-- START, green, left bottom -->
  <circle cx="507.5" cy="447" r="32" fill="#9a9a9a" stroke="#000" stroke-width="2.5"/>
  <circle cx="507.5" cy="447" r="27" fill="#444"/>
  <circle cx="507.5" cy="447" r="23" fill="#1a8a1a" stroke="#000" stroke-width="1.5"/>

  <!-- E-STOP, red mushroom, turn to release, right top -->
  <circle cx="1192.5" cy="326" r="42" fill="#c00" stroke="#000" stroke-width="2.5"/>
  <circle cx="1192.5" cy="326" r="35" fill="none" stroke="#900" stroke-width="2"/>
  <path d="M1170.5,318 A23,23 0 0 1 1206.5,307.5" fill="none" stroke="#fff" stroke-width="4" marker-end="url(#rot)"/>
  <path d="M1214.5,334 A23,23 0 0 1 1178.5,344.5" fill="none" stroke="#fff" stroke-width="4" marker-end="url(#rot)"/>

  <!-- MANUAL / AUTO selector, right bottom -->
  <circle cx="1192.5" cy="447" r="32" fill="#9a9a9a" stroke="#000" stroke-width="2.5"/>
  <circle cx="1192.5" cy="447" r="27" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
  <rect x="1186" y="419" width="13" height="56" rx="4" fill="#fff" stroke="#000" stroke-width="2.5" transform="rotate(40 1192.5 447)"/>

  <!-- leaders and balloons (white halo under black, as IMG-04-04) -->
  <path d="M1236,326 L1358,326" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M1236,326 L1358,326" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="1380" cy="326" r="21" fill="#000" stroke="#fff" stroke-width="5"/><text x="1380" y="336.4" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">1</text>

  <path d="M1226,447 L1358,447" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M1226,447 L1358,447" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="1380" cy="447" r="21" fill="#000" stroke="#fff" stroke-width="5"/><text x="1380" y="457.4" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <path d="M474,326 L342,326" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M474,326 L342,326" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="320" cy="326" r="21" fill="#000" stroke="#fff" stroke-width="5"/><text x="320" y="336.4" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">3</text>

  <path d="M474,447 L342,447" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M474,447 L342,447" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="320" cy="447" r="21" fill="#000" stroke="#fff" stroke-width="5"/><text x="320" y="457.4" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">4</text>

  <path d="M849,500 L849,603" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M849,500 L849,603" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="849" cy="618" r="21" fill="#000" stroke="#fff" stroke-width="5"/><text x="849" y="628.4" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">5</text>

  <path d="M786,112 L833,78" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M786,112 L833,78" fill="none" stroke="#000" stroke-width="2.5"/>
  <path d="M911,112 L865,78" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M911,112 L865,78" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="849" cy="64" r="21" fill="#000" stroke="#fff" stroke-width="5"/><text x="849" y="74.4" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">6</text>

  <!-- legend -->
  <circle cx="20" cy="760" r="18" fill="#000" stroke="#fff" stroke-width="5"/><text x="20" y="770.1" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="50" y="770" font-size="31"><tspan font-weight="700">E-STOP</tspan><tspan font-weight="400">, red, latching, turn to release</tspan></text>
  <text x="830" y="770" font-size="26" text-anchor="end">-SJ1</text>
  <circle cx="20" cy="810" r="18" fill="#000" stroke="#fff" stroke-width="5"/><text x="20" y="820.1" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="50" y="820" font-size="31"><tspan font-weight="700">MANUAL / AUTO</tspan><tspan font-weight="400"> selector, 2 positions</tspan></text>
  <text x="830" y="820" font-size="26" text-anchor="end">-SJ4</text>
  <circle cx="20" cy="860" r="18" fill="#000" stroke="#fff" stroke-width="5"/><text x="20" y="870.1" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="50" y="870" font-size="31"><tspan font-weight="700">RESET</tspan><tspan font-weight="400">, yellow push-button</tspan></text>
  <text x="830" y="870" font-size="26" text-anchor="end">-SJ3</text>

  <circle cx="900" cy="760" r="18" fill="#000" stroke="#fff" stroke-width="5"/><text x="900" y="770.1" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="930" y="770" font-size="31"><tspan font-weight="700">START</tspan><tspan font-weight="400">, green push-button (AUTO only)</tspan></text>
  <text x="1680" y="770" font-size="26" text-anchor="end">-SJ2</text>
  <circle cx="900" cy="810" r="18" fill="#000" stroke="#fff" stroke-width="5"/><text x="900" y="820.1" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="930" y="820" font-size="31"><tspan font-weight="400">Display, web interface</tspan></text>
  <text x="1680" y="820" font-size="26" text-anchor="end">-PH1</text>
  <circle cx="900" cy="860" r="18" fill="#000" stroke="#fff" stroke-width="5"/><text x="900" y="870.1" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="930" y="870" font-size="31"><tspan font-weight="400">Antennas</tspan></text>
</svg>
