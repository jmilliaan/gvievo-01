<svg xmlns="http://www.w3.org/2000/svg" width="360" height="216" viewBox="0 0 360 216" font-family="Arial, Helvetica, sans-serif">
  <title>Nameplate layout, AGV I-PRIME</title>
  <rect x="2" y="2" width="356" height="212" rx="8" fill="#E6E8EA" stroke="#5A5F66" stroke-width="2"/>
  <g fill="#fff" stroke="#5A5F66" stroke-width="1.5">
    <circle cx="14" cy="14" r="4"/><circle cx="346" cy="14" r="4"/>
    <circle cx="14" cy="202" r="4"/><circle cx="346" cy="202" r="4"/>
  </g>
  <text x="180" y="30" font-size="15" font-weight="700" text-anchor="middle">PT INTI GANDA PERDANA</text>
  <text x="180" y="46" font-size="10" text-anchor="middle">Jl Pegangsaan Dua Km 1.6, Jakarta Utara, Indonesia</text>
  <line x1="24" y1="56" x2="336" y2="56" stroke="#5A5F66" stroke-width="1"/>
  <g font-size="11">
    <text x="28" y="76">Model</text>                   <text x="160" y="76" font-weight="700">AGV I-PRIME</text>
    <text x="28" y="96">Type</text>                    <text x="160" y="96">Driverless tow tractor</text>
    <text x="28" y="116">Serial number</text>          <line x1="160" y1="118" x2="320" y2="118" stroke="#000" stroke-width="0.8"/>
    <text x="28" y="136">Year of construction</text>   <text x="160" y="136">2026</text>
    <text x="28" y="156">Unladen mass</text>           <line x1="160" y1="158" x2="226" y2="158" stroke="#000" stroke-width="0.8"/><text x="230" y="156">kg</text>
    <text x="28" y="176">Maximum towed mass</text>     <text x="160" y="176">1 000 kg</text>
    <text x="28" y="196">Battery voltage</text>        <text x="160" y="196">48 V DC</text>
  </g>
</svg>
