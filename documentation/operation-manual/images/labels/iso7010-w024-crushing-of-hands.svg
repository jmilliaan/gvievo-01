<svg xmlns="http://www.w3.org/2000/svg" width="48" height="42" viewBox="0 0 100 88">
  <title>Warning: crushing of hands (ISO 7010 W024, redrawn)</title>
  <path d="M50 6 L94 82 L6 82 Z" fill="#F9A800" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
  <!-- upper part moving down -->
  <rect x="36" y="34" width="28" height="9" fill="#000"/>
  <path d="M44 45 L56 45 L50 51 Z" fill="#000"/>
  <!-- hand, flat, fingers to the right -->
  <g fill="#000">
    <rect x="30" y="58" width="17" height="12" rx="3"/>
    <rect x="44" y="58" width="22" height="3" rx="1.5"/>
    <rect x="44" y="61.8" width="24" height="3" rx="1.5"/>
    <rect x="44" y="65.6" width="22" height="3" rx="1.5"/>
    <rect x="42" y="54.5" width="13" height="3" rx="1.5" transform="rotate(-18 42 56)"/>
  </g>
  <!-- lower part -->
  <rect x="24" y="71" width="52" height="5" fill="#000"/>
</svg>
