<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<nav class="toolbar" id="toolbar" aria-label="Page"></nav>
<main class="wrap"><div class="sheet" id="sheet"></div></main>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="../kit/jis-sheet.js"></script>
<script src="../kit/iec-sheet.js"></script>
<script src="data/project.js"></script>
<script>
  // 24 V control supply, part 1. source: ../01-schematic/proj01-sheet-03.html (MCB-04 → -FC3).
  // Rear scanner not fitted: no supply drawn for it.
  IEC.page(30, s => {
    const P = 40, N = 50, R1 = 70, R2 = 78, BOX = 165;

    /* ---- source and breaker ---- */
    s.fromTop(P, 30, 'P24', '/20.6'); s.fromTop(N, 30, 'N24', '/20.6');
    s.line(P, 30, P, R1); s.line(N, 30, N, R2);
    s.rail(R1, P, 400, '1P24', '', '/31');
    s.rail(R2, N, 400, '1N24', '', '/31');

    // load pairs: + from 1P24, − from 1N24
    const pair = (xp, xn, yEnd) => {
      s.line(xp, R1, xp, yEnd); s.dot(xp, R1);
      s.line(xn, R2, xn, yEnd); s.dot(xn, R2);
    };
    pair(80, 90, BOX);                                  // -BG1
    pair(185, 195, BOX);                                // -KE1, -KE2
    pair(300, 310, BOX);                                // -PJ1
    pair(365, 375, BOX);                                // -KE4
    // safety controller: XTIO module in parallel with the main module
    s.line(185, 140, 240, 140); s.dot(185, 140); s.line(240, 140, 240, BOX);
    s.line(195, 148, 250, 148); s.dot(195, 148); s.line(250, 148, 250, BOX);

    /* ---- devices ---- */
    s.locationBox(62, 150, 64, 52, '+VH', '');
    s.module(68, 120, BOX, 30, [{ x: 80, name: '+24V' }, { x: 90, name: '0V' }],
      ['-BG1', 'Safety scanner, front', 'OSSD /41.3']);
    s.module(170, 220, BOX, 30, [{ x: 185, name: 'A1' }, { x: 195, name: 'A2' }], ['-KE1', 'FX3-CPU0', '/43']);
    s.module(228, 278, BOX, 30, [{ x: 240, name: 'A1' }, { x: 250, name: 'A2' }], ['-KE2', 'FX3-XTIO84002', '/43']);
    s.locationBox(285, 150, 62, 52, '+VH', '');
    s.module(290, 342, BOX, 30, [{ x: 300, name: '+24V' }, { x: 310, name: '0V' }],
      ['-PJ1', 'Horn PATLITE', 'COM = 0V (jumper)', 'sound inputs /61']);
    s.module(352, 402, BOX, 30, [{ x: 365, name: '24V' }, { x: 375, name: '0V' }],
      ['-KE4', 'CK-EC5163', 'PE not connected', 'I/O /60, /61']);

    /* ---- breaker, cables ---- */
    s.breaker([P, N], 48, '-FC3', '2P 10 A DC');
    s.cable([80, 90], 135, '-WG1', 'SICK connection cable');

    s.note(30, 218, [
      'Notes',
      '1. Control wiring AWG22 (0.34 mm²) blue unless marked (page 3).',
      '2. Rear scanner (SF3) not fitted in this revision.',
      '3. All devices in +EB unless boxed.',
    ], { head: true });
  });
</script>
</body>
</html>
