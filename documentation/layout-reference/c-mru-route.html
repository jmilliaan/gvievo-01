<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-MRU Route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  /* Drawing-only layout image, same language as mru-straight-test-layout.html. Canvas 1920x1080.
     Route: manuals/site-layout-103.md section 4 (C-MRU). Site-plan directions (N = the MRU line at
     the top of the site plan). The HOME complex is to scale from
     homepos-area-projection/layout-projection.svg (+-200 mm): screen = (700 + 0.08 * proj_y,
     690 + 0.08 * proj_x), i.e. 1 m = 80 px, projection up = east, left = north. The trunk and the
     MRU line are schematic: their lengths and the machine side are not in the repo. */
  :root {
    --paper: #e9edf2;
    --surface: #ffffff;
    --ink: #14171d;
    --ink-2: #3d4553;
    --ink-3: #636b7c;
    --rule: #cbd2de;
    --route: #1f3f7a; --route-dark: #152c57;
    --out: #c2410c; --back: #1f3f7a;
    --tape: #b7bfcc;
    --tag: #c8176b;
    --agv: #23272f;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 0 40px;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.45 "IBM Plex Sans", Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------- toolbar (never captured) ---------------- */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 2px solid var(--ink);
  }
  .toolbar strong { margin-right: 8px; font: 700 15px "Archivo", Arial, sans-serif; }
  .seg { display: flex; border: 1.5px solid var(--ink); }
  .seg button, .toolbar .go {
    border: 0; border-left: 1px solid var(--rule);
    background: var(--surface); color: var(--ink-2);
    padding: 7px 12px; cursor: pointer;
    font: 600 11px "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: .07em; text-transform: uppercase;
  }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--agv); color: #fff; }
  .toolbar .go { border: 1.5px solid var(--route-dark); background: var(--route); color: #fff; }
  .toolbar .go:disabled { opacity: .6; cursor: progress; }
  .toolbar button:focus-visible { outline: 2px solid var(--tag); outline-offset: 2px; }
  .toolbar .status {
    margin-left: auto; color: var(--ink-3);
    font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .05em; text-transform: uppercase;
  }

  .stage-wrap { padding: 20px 16px 0; }
  .stage { position: relative; margin: 0 auto; box-shadow: 0 1px 0 var(--rule), 0 10px 30px rgba(20,30,50,.12); }

  /* ---------------- canvas 1920 x 1080 ---------------- */
  .slide {
    position: absolute; top: 0; left: 0;
    width: 1920px; height: 1080px;
    transform-origin: top left;
    overflow: hidden;
    background: var(--surface);
  }

  .dwg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .dwg text { font-family: "IBM Plex Mono", ui-monospace, monospace; fill: var(--ink-2); }
  .head { font: 700 36px "Archivo", Arial, sans-serif !important; text-transform: uppercase; fill: var(--ink) !important; }
  .sub  { font: 500 21px "IBM Plex Sans", Arial, sans-serif !important; }
  .h3   { font: 700 22px "Archivo", Arial, sans-serif !important; text-transform: uppercase; letter-spacing: .05em; fill: var(--ink) !important; }
  .lbl { font-size: 18px; font-weight: 600; }
  .sm  { font-size: 16px; font-weight: 600; }
  .rule { font: 500 18px "IBM Plex Sans", Arial, sans-serif !important; }
  .rule tspan.k { font-weight: 700; fill: var(--ink); }
  .stepname { font: 700 19px "Archivo", Arial, sans-serif !important; fill: var(--ink) !important; }
  .stepdo { font: 500 17px "IBM Plex Sans", Arial, sans-serif !important; }
  .num { font: 700 15px "Archivo", Arial, sans-serif !important; fill: #fff !important; }

  .tape { fill: none; stroke: var(--tape); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .notlaid { fill: none; stroke: var(--tape); stroke-width: 4; stroke-dasharray: 10 8; }
  .out  { fill: none; stroke: var(--out);  stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .back { fill: none; stroke: var(--back); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .chev-o { fill: none; stroke: var(--out); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .chev-b { fill: none; stroke: var(--back); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .jn { fill: #fff; stroke: var(--ink); stroke-width: 3; }
  .stn { fill: var(--tag); stroke: #fff; stroke-width: 2; }
  .mach { fill: #f5f6f8; stroke: var(--ink-3); stroke-width: 2; }
  .bo { fill: var(--out); }
  .bb { fill: var(--back); }
  .box { fill: #f8fafc; stroke: var(--rule); stroke-width: 2; }
  .warn { fill: #fff6ed; stroke: var(--out); stroke-width: 2; }
</style>
</head>
<body>

<nav class="toolbar" aria-label="Export">
  <strong>C-MRU Route</strong>

    <button type="button" data-res="3" aria-pressed="false">3× · 5760</button>
  </div>
  <div class="seg" role="group" aria-label="Background">
    <button type="button" data-bg="white" aria-pressed="true">White</button>
    <button type="button" data-bg="none" aria-pressed="false">Transparent</button>
  </div>
  <button type="button" class="go" id="download">Download PNG</button>
  <span class="status" id="status">16:9 · 1920 × 1080 base</span>
</nav>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
  const FILE_NAME = 'c-mru-route';

  /* ---- the sequence list (site-layout-103.md section 4, C-MRU) ---- */
  const STEPS = [
    ['o', 'HOME-N', 'depart empty on panel Start'],
    ['o', 'J-BMERGE', 'bay merge'],
    ['o', 'U-turn R717', 'empty only'],
    ['o', 'ATT', 'attach trolleys, Start'],
    ['o', 'J-N', 'RIGHT onto R2434'],
    ['o', 'X1', 'straight across'],
    ['o', 'J-ML', 'merge onto the trunk'],
    ['o', 'Trunk north', 'J-R2E straight, once laid'],
    ['o', 'MW-1 … MW-4', 'release at called machines'],
    ['o', 'U-MRU', 'pivot at tape end, empty'],
    ['b', 'ME-4 … ME-1', 'take the trolleys back'],
    ['b', 'Trunk south', 'J-R2E straight, once laid'],
    ['b', 'J-ML', 'LEFT onto R1380'],
    ['b', 'J-STEM', 'R2624 joins from the right'],
    ['b', 'J-SPLIT', 'LEFT into the north bay'],
    ['b', 'HOME-N', 'release trolleys, park'],
  ];
  const NS = 'http://www.w3.org/2000/svg';
  const g = document.getElementById('steps');
  const el = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text) e.textContent = text;
    g.appendChild(e);
  };
  STEPS.forEach(([leg, name, what], i) => {
    const y = 210 + i * 52.5;
    el('circle', { class: leg === 'o' ? 'bo' : 'bb', cx: 1576, cy: y, r: 14 });
    el('text', { class: 'num', x: 1576, y: y + 5, 'text-anchor': 'middle' }, String(i + 1));
    el('text', { class: 'stepname', x: 1602, y: y - 2 }, name);
    el('text', { class: 'stepdo', x: 1602, y: y + 19 }, what);
  });

  /* ---- fit the 1920x1080 canvas to the window ---- */
  const stage = document.getElementById('stage');
  const slide = document.getElementById('slide');
  function fit() {
    const avail = Math.min(document.documentElement.clientWidth - 32, 1920);
    const s = avail / 1920;
    stage.style.width = 1920 * s + 'px';
    stage.style.height = 1080 * s + 'px';
    slide.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();

  /* ---- export ---- */
  let res = 2, bg = 'white';
  document.querySelectorAll('[data-res]').forEach(b => b.addEventListener('click', () => {
    res = +b.dataset.res;
    document.querySelectorAll('[data-res]').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
  document.querySelectorAll('[data-bg]').forEach(b => b.addEventListener('click', () => {
    bg = b.dataset.bg;
    document.querySelectorAll('[data-bg]').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));

  const status = document.getElementById('status');
  const btn = document.getElementById('download');
  btn.addEventListener('click', async () => {
    if (!window.htmlToImage) { status.textContent = 'Export library did not load — check internet connection'; return; }
    btn.disabled = true;
    status.textContent = 'Rendering…';
    try {
      await document.fonts.ready;
      const transparent = bg === 'none';
      const url = await htmlToImage.toPng(slide, {
        width: 1920, height: 1080, pixelRatio: res,
        backgroundColor: transparent ? undefined : '#ffffff',
        style: { transform: 'none', background: transparent ? 'transparent' : '#ffffff' },
      });
      const a = document.createElement('a');
      a.href = url;
      a.download = `${FILE_NAME}@${res}x${transparent ? '-transparent' : ''}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      status.textContent = `Saved ${1920 * res} × ${1080 * res} PNG`;
    } catch (e) {
      console.error(e);
      status.textContent = 'Export failed — see console';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
