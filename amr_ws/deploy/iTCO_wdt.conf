# Load the chipset (TCO) hardware watchdog at boot (unified plan WP-P5, H-P2-5).
# install.sh --watchdog installs this as /etc/modules-load.d/iTCO_wdt.conf. The HWE
# kernel package blacklists the watchdog modules in /lib/modprobe.d/, which only stops
# them loading by alias: systemd-modules-load loads by name, so this still loads it.
# Check first (RUNBOOK section 5, "Hardware watchdog"): wdctl, lsmod | grep -i iTCO.
iTCO_wdt
