# Installed as /etc/needrestart/conf.d/amr.conf (unified plan WP-P1, S-needrestart-amr-override).
# An interactive `apt upgrade` over SSH must never restart the vehicle stack: needrestart
# preselects every service that maps a replaced library, and Enter restarts it, mid-shift
# and unwitnessed. These are listed but never preselected; restart them yourself, off-shift.
# Check with: perl -c /etc/needrestart/conf.d/amr.conf
$nrconf{override_rc}{qr(^amr\.service$)} = 0;
$nrconf{override_rc}{qr(^amr-failed\.service$)} = 0;
$nrconf{override_rc}{qr(^canable@)} = 0;
$nrconf{override_rc}{qr(^systemd-networkd)} = 0;
$nrconf{override_rc}{qr(^chrony)} = 0;
$nrconf{override_rc}{qr(^nginx)} = 0;
$nrconf{override_rc}{qr(^lightdm)} = 0;
$nrconf{override_rc}{qr(^agv-wifi-reconnect)} = 0;
# No "a newer kernel is available" prompt: kernel moves are deliberate (freeze.sh holds).
$nrconf{kernelhints} = -1;
1;
