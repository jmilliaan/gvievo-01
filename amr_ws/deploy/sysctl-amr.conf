# Shorten the window in which written data exists only in RAM (power-loss plan W6).
#
#   install -o root -g root -m 0644 sysctl-amr.conf /etc/sysctl.d/60-amr.conf
#   sudo sysctl --system
#
# The default 30 s expiry means a log line, an event or a map file written 29 s
# before a power cut can vanish even though write() returned. Everything important
# here (map bundles, the route store, operations.jsonl, error events) is already
# fsynced, so these settings are about the rest: the evidence you read afterwards.
# The cost is more frequent, smaller writeback - irrelevant for this workload.
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 200

# Swap only lengthens the dirty window and any boot fsck, and 8 GB of RAM with no
# swap in use today means it buys nothing. Remove the swap file as well:
#   sudo swapoff -a
#   sudo sed -i '/swap.img/d' /etc/fstab
#   sudo rm -f /swap.img
vm.swappiness = 0

# CycloneDDS asks for a 1 MiB socket receive buffer by default, and the kernel caps
# it at rmem_max (212992 here), so bursts on lo overflow: 265 RcvbufErrors counted
# 2026-10-24 (cpu-load-plan Tier 1 #7). 4 MiB lets Cyclone have what it asks for;
# nothing else on the vehicle asks for more than the default.
net.core.rmem_max = 4194304
