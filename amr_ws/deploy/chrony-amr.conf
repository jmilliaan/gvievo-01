# Installed by install.sh as /etc/chrony/conf.d/amr.conf (unified plan WP-A5).
# Step the clock only during the first three updates after chronyd starts (boot), slew after
# that. A step under a running vehicle moves wall/ROS time; the motion path no longer reads
# it (the mux stamps with time.monotonic and its tick runs on a STEADY timer), so this is the
# second line: it keeps event timestamps and logs continuous while the service runs.
# Ubuntu's chrony.conf already says the same; this pins it against a later edit there.
makestep 1 3
