# Age out ROS log files and run recordings (unified plan WP-P4, S-ros-log-bounding).
# install.sh installs this as /etc/tmpfiles.d/amr.conf; systemd-tmpfiles-clean.timer
# applies it (15 min after boot, then daily). Installing it starts or enables nothing.
#
# "e": only existing directories are cleaned, never created, so a data volume that is
# not mounted (~/.amr -> /data/amr/state, RUNBOOK section 5) is left alone. The paths
# go through ~/.amr, which is the state dir in both layouts.
#
# Never add the maps, operations.jsonl, events or reports here: those are vehicle data.
#
# Type Path                                  Mode User Group Age
e      /home/gvipc-evo-01/.amr/ros_log      -    -    -     7d
e      /home/gvipc-evo-01/.ros/log          -    -    -     7d
e      /home/gvipc-evo-01/.amr/runs         -    -    -     30d
