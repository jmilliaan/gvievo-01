# systemd pets the hardware watchdog (unified plan WP-P5, H-P2-5).
# install.sh --watchdog installs this as /etc/systemd/system.conf.d/60-amr-watchdog.conf.
# Takes effect at the next boot (or `systemctl daemon-reexec`).
#
# A PC that hangs hard (kernel or systemd itself stuck) is reset after 30 s instead of
# sitting dead under the vehicle. The drives have already latched 8130h by then (no PC
# heartbeat), so nothing is lost by the reset; after it the boot report says "Power was
# lost, or the PC restarted" and names the power cycle. No /dev/watchdog: systemd logs it
# and carries on, so this file is harmless where the module did not load.
[Manager]
RuntimeWatchdogSec=30
# A reboot that hangs is forced after 10 min (systemd's default, stated here on purpose).
RebootWatchdogSec=10min
