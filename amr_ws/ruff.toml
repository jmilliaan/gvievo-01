line-length = 110
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]

[lint.isort]
known-first-party = ["amr_base", "amr_sim", "amr_interfaces", "amr_description", "amr_bringup"]
# agv_core is the vehicle library at the repo root, installed with `pip install
# -e .` (or reached through PYTHONPATH on the vehicle). It is a third-party
# import from a ROS package's point of view, which is where ruff puts it by
# default - the "agv-repo" section that used to list ~20 bare module names went
# with the flat namespace on 2026-09-20.
