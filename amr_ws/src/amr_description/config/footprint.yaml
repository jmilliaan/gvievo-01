# Collision footprint of the vehicle in base_footprint (axle centre, x forward), metres.
# ONE source of truth: route validation (amr_navigation.footprint) and the Nav2
# local costmap (injected by nav.launch.py) both read this file.
#
# MEASURE: these are placeholders derived from the URDF chassis box (1.0 x 0.6 m,
# centred on the axle) plus the front overhang the lidar mount implies (the
# scanner sits 0.964 m ahead of the axle). Measure body, protrusions and load
# before physical route validation (spec §0.1 "Collision footprint").
polygon:
  - [-0.50, -0.35]
  - [ 1.10, -0.35]
  - [ 1.10,  0.35]
  - [-0.50,  0.35]
margin_m: 0.10          # route validation + obstruction checks, grown around the polygon.
                        # Halved from 0.20 on 2026-09-17 (operator request): now equal to the
                        # cross-track fault limit (0.10 m) with NO localisation allowance
                        # (sim AMCL p95 0.06 m, more in a turn). A route that validates with
                        # 0.10 m may still fault on cross-track or brush a wall while turning.
