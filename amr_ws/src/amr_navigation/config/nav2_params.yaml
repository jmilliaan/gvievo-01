# Nav2 components for drawn routes (spec §5): controller_server with RPP for straights,
# behavior_server with Spin for directed turns, a rolling local costmap. No planner,
# no BT navigator, no smoother: nothing here can insert a path the operator did not draw.
#
# The local costmap footprint is injected by nav.launch.py from
# amr_description/config/footprint.yaml (single source of truth).
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [precise]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    precise:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.025         # stop CENTRED on the endpoint: the checker fires the moment it is
                                       # inside, so 0.05 stops ~4.5 cm short every time (spec §5.2 wants +/-0.05)
      yaw_goal_tolerance: 0.035
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.30         # route limit cap; a route may lower it (executor scales the path? no: executor refuses higher)
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false   # aisles are 3.6 m wide; cost scaling only slows
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: false      # the executor rotates explicitly with Spin
      allow_reversing: false
      rotate_to_heading_angular_vel: 0.3
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 2.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      footprint: "[[-0.5, -0.35], [1.1, -0.35], [1.1, 0.35], [-0.5, 0.35]]"   # overridden at launch
      # No static layer: it needs the map frame before an initial pose exists and only
      # duplicates what the scan already shows; clearance against the saved map is
      # validated by the executor/route validator, not by the costmap.
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin]
    spin:
      plugin: nav2_behaviors/Spin
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.30           # spec §5.3 initial cap
    min_rotational_vel: 0.05           # low enough for the 2 deg stopping tolerance
    rotational_acc_lim: 0.5

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [controller_server, behavior_server]
    bond_timeout: 20.0     # startup load on the N97: the whole launch dies if a bond is missed
